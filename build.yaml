targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          # Generate files .freezed.dart
          union: true
          union_key: 'type'
          when_case: true

      json_serializable:
        enabled: true
        options:
          # Config for JSON
          any_map: false
          checked: false
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: false
          field_rename: none
          ignore_unannotated: false
          include_if_null: true