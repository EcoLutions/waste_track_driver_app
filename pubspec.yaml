name: waste_track_driver_app
description: "A mobile application for driver."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^9.0.5

  # Network
  dio: ^5.9.0
  http: ^1.6.0

  # Routing
  go_router: ^17.0.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Maps & Location
  google_maps_flutter: ^2.10.0
  location: ^8.0.1
  geolocator: ^14.0.2
  flutter_polyline_points: ^3.1.0
  url_launcher: ^6.3.2

  # Websockets
  stomp_dart_client: ^3.0.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.2
  logger: ^2.6.2
  flutter_animate: ^4.5.2

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.10.2
  freezed: ^3.2.3
  json_serializable: ^6.11.1

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  # Assets
  assets:
    - .env
    - assets/images/logo.png
    - assets/images/logo-with-name.png